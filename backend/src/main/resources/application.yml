spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cogniforge}
    username: ${DB_USER:cogni}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: PT15M
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
